name: news-fetch
on:
  schedule:
    - cron: "15 * * * *"   # har 1 ghante (UTC)
  workflow_dispatch: {}        # Actions tab se haath se bhi chala sakte ho
permissions:
  contents: write
concurrency:
  group: news-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news/news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "news update" && git push; fi
