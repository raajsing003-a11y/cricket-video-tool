<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Prediction → Scenes JSON</title>
<style>:root{--bg:#0e1116;--c1:#171b22;--ln:#2a313c;--tx:#e9edf3;--mu:#8b95a5;--bl:#2a6fdb;--gr:#22a06b}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}#w{max-width:900px;margin:0 auto;padding:10px 12px 60px}h1{font-size:18px}.box{background:var(--c1);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:10px}
label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}input,textarea{width:100%;background:#0b0e13;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit}.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;margin:8px 6px 0 0}button.ok{background:var(--gr)}a{color:#fc3}</style></head><body><div id="w">
<h1>🔮 Match Prediction → scenes JSON</h1><div class="sub" style="color:#8b95a5;font-size:12px">Details bharo → JSON banao → <a href="../index.html">video tool</a> mein JSON load karo (script bhi teleprompter mein aa jaayegi). Prediction hamesha "अनुमान" label ke saath dikhti hai. Fantasy/betting promotion nahi.</div>
<div class="box"><div class="r"><div><label>Team A (jaise KKR)</label><input id="a" value="KKR"></div><div><label>Team B</label><input id="b" value="CSK"></div></div>
<div class="r"><div><label>Venue</label><input id="venue" value="Eden Gardens, Kolkata"></div><div><label>Date</label><input id="date" value=""></div></div>
<div class="r3"><div><label>A ke jeetne ka chance % (win%)</label><input id="pa" value="55"></div><div><label>H2H: A ki jeet</label><input id="wa" value="14"></div><div><label>H2H: B ki jeet</label><input id="wb" value="11"></div></div>
<div class="r3"><div><label>Bina nateeja (optional)</label><input id="nr" value="0"></div><div><label>A ke last 5 (W/L)</label><input id="fa" value="WWLWL"></div><div><label>B ke last 5 (W/L)</label><input id="fb" value="LWWLW"></div></div></div>
<div class="box"><div class="r"><div><label>Pitch type</label><input id="ptype" value="बल्लेबाज़ी पिच"></div><div><label>Toss tip</label><input id="toss" value="टॉस जीतो, पहले गेंदबाज़ी"></div></div>
<label>Pitch numbers (ek line = label|value, 2-4 line)</label><textarea id="pitems" rows="4">पहली पारी औसत|172
चेज़ जीत|58%
पावरप्ले औसत रन|52</textarea></div>
<div class="box"><div class="r"><div><label>Team A XI (ek line = ek player; captain ke aage (C))</label><textarea id="xa" rows="11"></textarea></div><div><label>Team B XI</label><textarea id="xb" rows="11"></textarea></div></div>
<label>Verdict line (winprob card par, max ~60 akshar)</label><input id="verdict" value="पिच और टॉस देखकर KKR का पलड़ा हल्का भारी">
<button id="go" class="ok">⚙ JSON banao</button><button id="cp">📋 Copy</button><button id="dl">⬇ Download scenes_prediction.json</button>
<textarea id="out" rows="10" style="margin-top:8px"></textarea></div></div>
<script src="../js/photo_slots.js"></script>
<script>
const $=id=>document.getElementById(id),F=['a','b','venue','date','pa','wa','wb','nr','fa','fb','ptype','toss','pitems','xa','xb','verdict'];
const CH={KKR:'kolkata',CSK:'chennai',MI:'mumbai',RCB:'bengaluru',DC:'delhi',GT:'gujarat',SRH:'hyderabad',LSG:'lucknow',PBKS:'punjab',RR:'rajasthan'};
try{const s=JSON.parse(localStorage.getItem('cvt_predict')||'{}');F.forEach(k=>{if(s[k]!=null)$(k).value=s[k];});}catch(e){}
const chip=n=>CH[String(n).trim().toUpperCase()]?'04_team_chips/chip_'+CH[String(n).trim().toUpperCase()]:undefined;
const slug=n=>'custom_'+n.toLowerCase().replace(/[^\p{L}\p{M}\p{N}]+/gu,'_').replace(/^_|_$/g,'');
const known=n=>{const c=n.replace(/\s*\(C\)\s*$/i,'').trim().toLowerCase(),S=window.PHOTO_SLOTS||[];const m=S.find(s=>s.en&&s.en.toLowerCase()===c);return m?m.id:slug(c);};
const xi=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,11).map(x=>{const cap=/\(C\)\s*$/i.test(x);return x.replace(/\s*\(C\)\s*$/i,'')+(cap?' (C)':'')+'|'+known(x);});
$('go').onclick=()=>{const v=k=>$(k).value.trim(),A=v('a'),B=v('b'),pa=+v('pa')||50;
 const sv={};F.forEach(k=>sv[k]=$(k).value);try{localStorage.setItem('cvt_predict',JSON.stringify(sv));}catch(e){}
 const items=v('pitems').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
 const fav=pa>=50?A:B,fp=Math.max(pa,100-pa);
 const script=[v('date')?v('date')+' — ':'','आज का बड़ा मैच: '+A+' बनाम '+B+', '+v('venue')+'.','आमने-सामने '+A+' '+v('wa')+' जीत, '+B+' '+v('wb')+' जीत.','पिच: '+v('ptype')+'. '+items.map(s=>s.replace('|',' ')).join(', ')+'.',v('toss'),A+' की संभावित प्लेइंग XI, और '+B+' की संभावित प्लेइंग XI.','हमारा अनुमान: '+fav+' का चांस लगभग '+fp+'% है. ये सिर्फ़ अनुमान है, पक्का नहीं.'].join('\n');
 const sc=[
 {type:'h2h',dur:9,chunk:1,data:{title:A+' बनाम '+B,a:A,b:B,wa:+v('wa')||0,wb:+v('wb')||0,nr:+v('nr')||0,fa:v('fa'),fb:v('fb')}},
 {type:'pitch',dur:9,chunk:2,tr:'slideup',data:{title:'पिच रिपोर्ट — '+v('venue'),type:v('ptype'),items,toss:v('toss')}},
 {type:'xi',dur:11,chunk:3,tr:'push',data:{title:'प्लेइंग XI',team:A,c:'y',players:xi('xa')}},
 {type:'xi',dur:11,chunk:4,tr:'push',data:{title:'प्लेइंग XI',team:B,c:'b',players:xi('xb')}},
 {type:'winprob',dur:10,chunk:5,tr:'zoom',data:{title:'जीत का चांस',a:A,b:B,pa,ca:chip(A),cb:chip(B),note:v('verdict')}}];
 sc.forEach(s=>{Object.keys(s.data).forEach(k=>{if(s.data[k]===undefined)delete s.data[k];});});
 $('out').value=JSON.stringify({script,scenes:sc},null,1);};
$('cp').onclick=()=>{$('out').select();navigator.clipboard.writeText($('out').value);};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('out').value],{type:'application/json'}));a.download='scenes_prediction.json';a.click();};
</script><script src="../js/tg_share.js"></script>
</body></html>
